[project]
name = "agent-reviewer"
version = "0.1.0"
description = "Human-in-the-loop agent that scans GitHub repos for inefficient SQL, Python, and Spark code, then opens a PR after review."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "openai>=1.50.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.12",
  "rich>=13.8.0",
  "typer>=0.12.5",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
agent-reviewer = "agent_reviewer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_reviewer"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_reviewer/web/templates" = "agent_reviewer/web/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
